<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit or remove DOM</title>
</head>
<body style="background-color: #212121; color: #fff;">

    <ul class="language">
        <li>javaScript</li>
    </ul>
    
</body>
<script>
    function add_language(langName){
        const newLang = document.createElement("li")
        newLang.innerText = langName;

        const langList = document.querySelector(".language")

        langList.appendChild(newLang);

    }
    add_language("Python")

    // This is Optimized Approach because there we dont have to traverse from top to bottom in the dom tree
    function addOptLanguage(langName){
        const li = document.createElement("li")
        li.append(document.createTextNode(langName))
        document.querySelector('.language').appendChild(li)
    }
    addOptLanguage("golang")

    // Edit
    const secondLang = document.querySelector("li:nth-child(2)")
    const newLi = document.createElement('li')
    newLi.textContent = "Mojo"
    secondLang.replaceWith(newLi)
     
     // edit
     const firstLang = document.querySelector("li:first-child")
     firstLang.outerHTML = "<li>TypeScript</li>"

     //edit
     const lastLang = document.querySelector("li:last-child")
     lastLang.remove()
</script>
</html>
